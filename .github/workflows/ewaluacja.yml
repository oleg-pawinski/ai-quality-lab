# Ewaluacja wersji demo w GitHub Actions (CI, część 2)
# Uruchamia sondy z promptfooconfig.yaml na serwerze GitHuba (3 powtórzenia),
# a o kolorze buildu decyduje bramka jakości (bramka.py), nie samo promptfoo.
# Działa po pushu do main i przy każdym pull requeście do main.

name: Ewaluacja wersji demo

on:
  workflow_dispatch:            # przycisk "Run workflow" w zakładce Actions
  push:
    branches: [main]
    paths:                      # uruchom tylko, gdy zmienia się coś, co wpływa na wynik
      - "promptfooconfig.yaml"
      - "sondy/**"
      - "bramka.py"
      - ".github/workflows/ewaluacja.yml"
  pull_request:                 # bramka sprawdza też każdą propozycję zmiany (PR) do main
    branches: [main]
    paths:                      # ta sama lista co wyżej
      - "promptfooconfig.yaml"
      - "sondy/**"
      - "bramka.py"
      - ".github/workflows/ewaluacja.yml"

permissions:
  contents: read                # workflow może tylko czytać repo, nic w nim nie zmieni

concurrency:
  group: ewaluacja
  cancel-in-progress: true      # dwa szybkie pushe = liczy się tylko ostatni (oszczędza tokeny)

jobs:
  ewaluacja:
    runs-on: ubuntu-latest
    timeout-minutes: 20         # bezpiecznik: zawieszony przebieg nie będzie wisiał godzinami

    steps:
      - name: Pobierz kod repo
        uses: actions/checkout@v6

      - name: Zainstaluj Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Uruchom ewaluację (promptfoo, 3 powtórzenia)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROMPTFOO_FAILED_TEST_EXIT_CODE: "0"   # o failach decyduje bramka w kolejnym kroku
          PROMPTFOO_DISABLE_TELEMETRY: "1"
        run: npx --yes promptfoo@latest eval -c promptfooconfig.yaml --repeat 3 --no-cache --output wyniki.json

      - name: Bramka jakości
        shell: bash
        run: |
          set +e
          python3 bramka.py wyniki.json > bramka.txt
          kod=$?
          cat bramka.txt
          { echo '```'; cat bramka.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $kod

      - name: Zachowaj wyniki jako artefakt
        if: always()                # zapisz wyniki także wtedy, gdy bramka jest zamknięta
        uses: actions/upload-artifact@v5
        with:
          name: wyniki-ewaluacji
          path: wyniki.json
          retention-days: 14
